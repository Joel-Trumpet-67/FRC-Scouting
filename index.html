<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FRC Scouting</title>
    <style>
      body {
        background: #0d0d0d; color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, Roboto, 'Helvetica Neue', sans-serif;
        text-align: center; margin: 0; padding: 0;
      }
      .main-panel { margin-top: 20vh; }
      h2 { font-size: 28px; color: #97c7f0; margin-bottom: 6px; font-weight: 600; }
      .sub { font-size: 13px; color: #555; margin-bottom: 32px; }
      .btn-group { display: flex; flex-direction: column; align-items: center; gap: 14px; }
      .btn {
        font-size: 16px; padding: 14px 0; width: 240px;
        background: rgb(151, 199, 240); color: #000;
        text-decoration: none; border-radius: 6px; font-weight: 600;
        display: block;
      }
      .btn-pit  { background: rgb(175, 207, 163); }
      .btn-dash { background: #1a3a5a; color: #97c7f0; }
      .btn:hover { filter: brightness(1.12); }
    </style>
  </head>
  <body>
    <div class="main-panel">
      <h2>FRC Scouting</h2>
      <p class="sub">Select a mode</p>
      <div class="btn-group">
        <a href="match.html"     class="btn">Match Scouting</a>
        <a href="pit.html"       class="btn btn-pit">Pit Scouting</a>
        <a href="dashboard.html" class="btn btn-dash">Dashboard</a>
      </div>
    </div>
  </body>
</html>
